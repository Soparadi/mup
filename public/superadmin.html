<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>MovUP — Comptes</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* Palette des pages app — reprise à l'identique de statistiques.html, plus
   --accent / --shadow-sm / --radius (déjà en usage sur contacts.html). Aucune
   valeur nouvelle : --bg et --surface étaient inversés ici par rapport aux
   treize autres pages, ils reprennent leur rôle canonique. */
:root{
  --bg:#FFFFFF; --surface:#F5F5F7; --surface2:#EBEBF0;
  --card:#FFFFFF; --border:#E8E8ED; --border2:#C7C7CC;
  --text:#1D1D1F; --muted:#6E6E73; --muted2:#AEAEB2;
  --green:#1D8348; --orange:#B84C00; --red:#CC0000;
  --blue:#0A66C2; --purple:#4338CA;
  --accent:#1D1D1F;
  --font:'Geist',-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Geist Mono','SF Mono','Menlo',monospace;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --radius:10px;
}

html,body{height:100%;overflow:hidden;background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
main{flex:1;overflow-y:auto;height:calc(100vh - var(--app-footer-h));}

/* ── EN-TÊTE DE PAGE ── */
.page-header{background:var(--text);color:#fff;padding:28px 36px;display:flex;align-items:center;justify-content:space-between;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.4px;}
.page-subtitle{font-size:11px;color:rgba(255,255,255,.5);font-weight:500;letter-spacing:.4px;margin-top:2px;}

.container{padding:24px 36px 60px;display:flex;flex-direction:column;gap:18px;}

/* ── CARTES CHIFFRÉES ── */
.grid-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 14px 14px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;border-left:3px solid var(--border);}
.kpi-card.k-closing{border-left-color:var(--text);} .kpi-card.k-closing .kpi-value{color:var(--text);}
.kpi-label{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px;line-height:1;}
.kpi-value{font-size:32px;font-weight:900;line-height:1;letter-spacing:-.8px;font-family:var(--font);margin-top:6px;}
.kpi-sub{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:3px;letter-spacing:.2px;}

/* ── CARTE ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0;overflow:hidden;}
.card-header-light{padding:18px 22px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:14px;}
.card-header-light h3{font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--text);margin:0;}
.card-header-light .card-subtitle{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.4px;text-transform:none;}
.card-body{padding:0 22px 22px;}

/* ── SÉRIE EN BARRES ── */
.calyear-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:200px;padding:0 4px 0;margin-bottom:14px;position:relative;}
.calyear-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;position:relative;}
.calyear-bar-amount{font-size:10px;font-weight:700;font-family:var(--mono);color:var(--text);min-height:14px;letter-spacing:-.2px;text-align:center;line-height:1;}
.calyear-bar-amount.empty{color:var(--muted2);font-weight:500;}
.calyear-bar-track{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--surface);border-radius:5px 5px 0 0;overflow:hidden;}
.calyear-bar-fill{width:100%;background:var(--accent);border-radius:5px 5px 0 0;transition:height .4s;min-height:2px;}
.calyear-bar-fill.empty{background:var(--surface2);min-height:2px;}
.calyear-bar-label{font-size:9.5px;font-weight:700;font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1;}
.calyear-bar-col.is-current .calyear-bar-label{color:var(--text);font-weight:800;}

/* ── ENCART ÉTAT (chargement / refus / vide) ── */
.notice{
  max-width:520px;margin:40px auto;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px 24px;text-align:center;box-shadow:var(--shadow-sm);
}
.notice-icon{
  width:44px;height:44px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  background:var(--surface2);color:var(--muted);
}
.notice-title{font-size:15px;font-weight:700;color:var(--text)}
.notice-text{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ── TABLEAU ── */
.table-wrap{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-sm);
}
table.accounts{width:100%;border-collapse:collapse;font-size:12.5px}
table.accounts thead th{
  text-align:left;font-weight:600;color:var(--muted);
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;
  padding:11px 14px;border-bottom:1px solid var(--border);
  background:var(--surface);white-space:nowrap;
}
table.accounts tbody td{
  padding:11px 14px;border-bottom:1px solid var(--border);
  color:var(--text);vertical-align:middle;
}
table.accounts tbody tr:last-child td{border-bottom:none}
table.accounts tbody tr:hover{background:var(--surface)}
td.email{font-weight:500}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--muted)}
td.muted{color:var(--muted)}
.tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  font-size:11px;font-weight:600;white-space:nowrap;
  background:var(--surface2);color:var(--text);
}
.dash{color:var(--muted2)}

/* ── TOGGLE VIP ── */
/* Interrupteur ON = orange MovUP. Le statut VIP libère le compte du mur
   d'abonnement ; il n'ouvre PAS le superadmin (statuts disjoints). */
.vip-toggle{
  position:relative;display:inline-flex;align-items:center;
  width:38px;height:22px;border-radius:11px;
  border:1px solid var(--border2);background:var(--surface2);
  padding:0;cursor:pointer;vertical-align:middle;
  transition:background .15s,border-color .15s;
}
.vip-toggle .vip-knob{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:50%;background:#FFFFFF;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s;
}
.vip-toggle[aria-checked="true"]{background:var(--orange);border-color:var(--orange)}
.vip-toggle[aria-checked="true"] .vip-knob{left:18px}
.vip-toggle:disabled{opacity:.5;cursor:default}
.vip-toggle:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ── TOAST (retour discret après action) ── */
.vip-toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--text);color:#FFFFFF;font-size:12.5px;font-weight:500;
  padding:9px 16px;border-radius:8px;box-shadow:var(--shadow-sm);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
}
.vip-toast.show{opacity:1}
</style>

<body>

<aside id="sidebar" class="sidebar"></aside>

<main>

  <div class="page-header">
    <div>
      <div class="page-title">Comptes</div>
      <div class="page-subtitle" id="page-subtitle">Inventaire des comptes — lecture seule</div>
    </div>
  </div>

  <div class="container" id="content">
    <div class="notice">
      <div class="notice-title">Chargement…</div>
      <div class="notice-text">Récupération de l'inventaire des comptes.</div>
    </div>
  </div>

</main>

<footer class="mup-app-footer">
  <div class="mup-app-footer__inner">

<script defer src="/scripts/cookies-banner.js"></script>
<script>
(function () {
  var content = document.getElementById('content');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Date FR lisible (jj/mm/aaaa) ; vide si null/invalide.
  function fmtDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function num(v) {
    var n = Number(v);
    return Number.isFinite(n) ? String(n) : '0';
  }

  function cellText(v) {
    var s = (v == null ? '' : String(v)).trim();
    return s ? esc(s) : '<span class="dash">—</span>';
  }

  function noticeForbidden() {
    return '<div class="notice">'
      + '<div class="notice-icon">'
      + '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
      + '</div>'
      + '<div class="notice-title">Accès non autorisé</div>'
      + '<div class="notice-text">Vous n\'avez pas les droits nécessaires pour consulter cette page.</div>'
      + '</div>';
  }

  function noticeError(msg) {
    return '<div class="notice">'
      + '<div class="notice-title">Chargement impossible</div>'
      + '<div class="notice-text">' + esc(msg || 'Une erreur est survenue. Veuillez réessayer plus tard.') + '</div>'
      + '</div>';
  }

  function noticeEmpty() {
    return '<div class="notice">'
      + '<div class="notice-title">Aucun compte</div>'
      + '<div class="notice-text">L\'inventaire ne contient aucun compte pour le moment.</div>'
      + '</div>';
  }

  // ── CARTES CHIFFRÉES ───────────────────────────────────────────────────
  // Les cinq indicateurs se dérivent du seul corps renvoyé par
  // /api/admin/comptes (server.js:1050-1062) : aucun appel supplémentaire,
  // aucune donnée qui n'y figure pas. Statuts d'abonnement et d'essai tels
  // qu'ils sont écrits côté serveur (active / trialing / past_due / canceled,
  // active / converted / expired).
  function kpiCard(label, value, sub) {
    return '<div class="kpi-card k-closing">'
      + '<div class="kpi-label">' + esc(label) + '</div>'
      + '<div class="kpi-value">' + esc(value) + '</div>'
      + '<div class="kpi-sub">' + esc(sub) + '</div>'
      + '</div>';
  }

  function renderKpis(rows) {
    var total = rows.length;
    var abonnes = 0, essais = 0, convertis = 0, vip = 0, fiches = 0, leads = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i] || {};
      if (r.subscription_status === 'active') abonnes++;
      if (r.trial_status === 'active') essais++;
      if (r.trial_status === 'converted') convertis++;
      if (r.bypass) vip++;
      fiches += Number(r.fiches) || 0;
      leads += Number(r.leads) || 0;
    }
    var pct = total ? Math.round(abonnes / total * 100) : 0;

    return '<div class="grid-kpi">'
      + kpiCard('Comptes', String(total), 'inscrits au total')
      + kpiCard('Essais en cours', String(essais), convertis + ' convertis')
      + kpiCard('Abonnés', String(abonnes), pct + ' % des comptes')
      + kpiCard('Fiches', String(fiches), leads + ' leads consommés')
      + kpiCard('VIP', String(vip), 'hors mur d’abonnement')
      + '</div>';
  }

  // ── SÉRIE HEBDOMADAIRE ─────────────────────────────────────────────────
  // Inscriptions par semaine sur les douze dernières, lundi comme premier
  // jour. Barres en CSS pur, une seule couleur : var(--accent).
  var WEEKS = 12;

  function mondayOf(d) {
    var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = m.getDay();               // 0 = dimanche
    m.setDate(m.getDate() - (day === 0 ? 6 : day - 1));
    return m;
  }

  function renderSemaines(rows) {
    // Bornes posées en arithmétique de calendrier (setDate) et écarts arrondis
    // au jour : un changement d'heure dans la fenêtre décale les millisecondes,
    // jamais le rang de la semaine.
    var lastMonday = mondayOf(new Date());
    var firstMonday = new Date(lastMonday.getFullYear(), lastMonday.getMonth(), lastMonday.getDate() - (WEEKS - 1) * 7);

    var buckets = [];
    for (var w = 0; w < WEEKS; w++) {
      buckets.push({
        start: new Date(firstMonday.getFullYear(), firstMonday.getMonth(), firstMonday.getDate() + w * 7),
        n: 0
      });
    }

    var total = 0;
    for (var i = 0; i < rows.length; i++) {
      var raw = rows[i] && rows[i].created_at;
      if (!raw) continue;
      var d = new Date(raw);
      if (isNaN(d.getTime())) continue;
      var jours = Math.round((mondayOf(d).getTime() - firstMonday.getTime()) / 86400000);
      var idx = Math.round(jours / 7);
      if (idx < 0 || idx >= WEEKS) continue;
      buckets[idx].n++;
      total++;
    }

    var max = 0;
    for (var j = 0; j < buckets.length; j++) if (buckets[j].n > max) max = buckets[j].n;

    var cols = '';
    for (var k = 0; k < buckets.length; k++) {
      var b = buckets[k];
      var isCurrent = (k === buckets.length - 1);
      var hasData = b.n > 0;
      var h = (max > 0 && hasData) ? Math.max(2, Math.round(b.n / max * 100)) : 0;
      var label = b.start.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });

      cols += '<div class="calyear-bar-col' + (isCurrent ? ' is-current' : '') + '">'
        + '<div class="calyear-bar-amount' + (hasData ? '' : ' empty') + '">' + (hasData ? b.n : '—') + '</div>'
        + '<div class="calyear-bar-track">'
        + (hasData
            ? '<div class="calyear-bar-fill" style="height:' + h + '%;"></div>'
            : '<div class="calyear-bar-fill empty" style="height:2px;"></div>')
        + '</div>'
        + '<div class="calyear-bar-label">' + esc(label) + '</div>'
        + '</div>';
    }

    return '<div class="card">'
      + '<div class="card-header-light">'
      + '<h3>Inscriptions</h3>'
      + '<div class="card-subtitle">' + total + ' sur les 12 dernières semaines</div>'
      + '</div>'
      + '<div class="card-body"><div class="calyear-chart">' + cols + '</div></div>'
      + '</div>';
  }

  function renderTable(rows) {
    var head = '<thead><tr>'
      + '<th>Email</th>'
      + '<th>Prénom</th>'
      + '<th>Plan</th>'
      + '<th>Statut abo</th>'
      + '<th>Essai</th>'
      + '<th>Fin période</th>'
      + '<th>Fiches</th>'
      + '<th>Leads</th>'
      + '<th>Créé le</th>'
      + '<th>VIP</th>'
      + '</tr></thead>';

    var body = '<tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i] || {};
      body += '<tr>'
        + '<td class="email">' + cellText(r.email) + '</td>'
        + '<td>' + cellText(r.prenom) + '</td>'
        + '<td><span class="tag">' + esc(r.plan || 'gratuit') + '</span></td>'
        + '<td class="muted">' + cellText(r.subscription_status) + '</td>'
        + '<td class="muted">' + cellText(r.trial_status) + '</td>'
        + '<td class="muted">' + (fmtDate(r.current_period_end) ? esc(fmtDate(r.current_period_end)) : '<span class="dash">—</span>') + '</td>'
        + '<td class="num">' + num(r.fiches) + '</td>'
        + '<td class="num">' + num(r.leads) + '</td>'
        + '<td class="muted">' + (fmtDate(r.created_at) ? esc(fmtDate(r.created_at)) : '<span class="dash">—</span>') + '</td>'
        + '<td><button type="button" class="vip-toggle" role="switch" aria-checked="' + (r.bypass ? 'true' : 'false') + '" data-email="' + esc(r.email || '') + '" aria-label="Statut VIP"><span class="vip-knob"></span></button></td>'
        + '</tr>';
    }
    body += '</tbody>';

    return '<div class="table-wrap"><table class="accounts">' + head + body + '</table></div>';
  }

  // Retour discret (succès/échec) sans recharger le tableau.
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'vip-toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  // Délégation : le tableau est ré-injecté via innerHTML, mais l'écouteur posé
  // sur le conteneur persistant capte les clics sur n'importe quel toggle.
  // POST { email, bypass: !état } ; on ne bascule l'affichage qu'au succès.
  // Sur 403 / échec : message neutre, l'état visuel reste inchangé.
  content.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.vip-toggle') : null;
    if (!btn) return;
    var email = btn.getAttribute('data-email');
    if (!email) return;
    var next = btn.getAttribute('aria-checked') !== 'true';
    btn.disabled = true;
    fetch('/api/admin/comptes/bypass', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, bypass: next })
    })
      .then(function (res) {
        if (res.status === 403) { toast('Action non autorisée.'); return null; }
        if (!res.ok) { toast('Mise à jour impossible. Veuillez réessayer.'); return null; }
        return res.json();
      })
      .then(function (data) {
        if (data && typeof data.bypass === 'boolean') {
          btn.setAttribute('aria-checked', data.bypass ? 'true' : 'false');
          toast(data.bypass ? 'Statut VIP activé.' : 'Statut VIP désactivé.');
        }
      })
      .catch(function () { toast('Mise à jour impossible. Veuillez réessayer.'); })
      .finally(function () { btn.disabled = false; });
  });

  fetch('/api/admin/comptes', { credentials: 'same-origin' })
    .then(function (res) {
      if (res.status === 403) {
        var header = document.querySelector('.page-header');
        if (header) header.style.display = 'none';
        content.innerHTML = noticeForbidden();
        return null;
      }
      if (!res.ok) { content.innerHTML = noticeError(); return null; }
      return res.json();
    })
    .then(function (rows) {
      if (rows === null) return;
      if (!Array.isArray(rows) || rows.length === 0) { content.innerHTML = noticeEmpty(); return; }
      var sub = document.getElementById('page-subtitle');
      if (sub) sub.textContent = rows.length + ' compte' + (rows.length > 1 ? 's' : '') + ' — lecture seule';
      content.innerHTML = renderKpis(rows) + renderSemaines(rows) + renderTable(rows);
    })
    .catch(function () {
      content.innerHTML = noticeError();
    });
})();
</script>
</body>
