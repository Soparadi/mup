<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovUP — Carte</title>
<link rel="stylesheet" href="/styles/fonts.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!-- MarkerCluster — même version et mêmes sources que Prospection
     (prospection.html:13-15). Les DEUX feuilles sont requises : MarkerCluster.css
     porte l'animation d'éclatement, MarkerCluster.Default.css les jambes
     (.leaflet-cluster-spider-leg) qui relient les marqueurs éclatés à leur
     pastille. Sans elles, le clic éclate sans rien dessiner. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="/styles/sidebar.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--surface:#F5F5F7;--surface2:#EBEBF0;
  --card:#FFFFFF;--border:#E8E8ED;--border2:#C7C7CC;
  --text:#1D1D1F;--muted:#6E6E73;--muted2:#AEAEB2;
  --green:#1D8348;--orange:#B84C00;--red:#CC0000;
  --blue:#0A66C2;--purple:#4338CA;
  --font:'Geist',-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Geist Mono','SF Mono','Menlo',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font);font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased;display:flex}

/* SIDEBAR */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 10px;flex-shrink:0;height:100vh;overflow-y:auto}
.sb-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);padding:10px 8px 5px;margin-top:6px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);transition:all .12s;text-decoration:none;cursor:pointer}
.sb-item:hover{color:var(--text);background:var(--surface2)}
.sb-item.active{color:var(--text);background:var(--card);font-weight:600;border:1px solid var(--border)}
.sb-icon{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-badge{margin-left:auto;font-size:9px;font-weight:800;font-family:var(--mono);background:var(--text);color:#fff;border-radius:6px;padding:1px 6px}

/* SHELL */
.shell{flex:1;position:relative;height:calc(100vh - var(--app-footer-h));overflow:hidden;transition:margin-right .25s ease}
.shell.tour-open{margin-right:280px}
#map{width:100%;height:100%;isolation:isolate}

/* LEAFLET OVERRIDES */
.leaflet-container{font-family:var(--font)!important}
.leaflet-tile-pane{filter:grayscale(100%) contrast(1.1)}
.leaflet-popup-content-wrapper{border-radius:12px!important;border:1px solid var(--border)!important;box-shadow:0 10px 28px rgba(0,0,0,.12)!important;padding:0!important;overflow:hidden}
.leaflet-popup-content{margin:0!important;width:auto!important}
/* La pointe reste au rendu Leaflet standard — triangle blanc sans bordure.
   La masquer laissait la bulle flotter sans désigner sa fiche. Les offsets
   des deux bindPopup sont réglés sur sa hauteur : les toucher la décolle. */

/* POPUP CARD */
.pop{padding:12px 14px;width:220px;font-family:var(--font)}
.pop-bar{height:3px;border-radius:10px 10px 0 0;margin:-12px -14px 10px}
.pop-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:1px}
.pop-co{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.pop-foot{display:flex;align-items:center;justify-content:space-between}
.pop-val{font-size:12px;font-weight:800;font-family:var(--mono);color:var(--text)}
.pop-days{font-size:10px;font-weight:600;color:var(--muted2);background:var(--surface);border-radius:4px;padding:2px 6px}
.pop-stage{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:6px}
.pop-progress{display:flex;align-items:center;gap:2px;margin-top:8px}
.pop-actions{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.pop-btn{flex:1;padding:5px 0;border-radius:7px;border:1px solid var(--border);background:var(--card);font-family:var(--font);font-size:10px;font-weight:600;cursor:pointer;color:var(--text);text-align:center;transition:all .12s}
.pop-btn:hover{border-color:var(--text);background:var(--surface)}
.pop-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

/* USER LOCATION PULSE */
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
.user-dot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 2px 8px rgba(37,99,235,.4);position:relative}
.user-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:#2563eb;animation:pulse 2s ease-out infinite;opacity:.4}

/* TOUR PANEL */
.tour-panel{position:fixed;right:0;top:0;bottom:var(--app-footer-h);width:280px;z-index:800;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;overflow:hidden}
.tour-panel.open{transform:translateX(0)}
.tour-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tour-title{font-size:13px;font-weight:700;color:var(--text)}
.tour-count{font-size:10px;font-weight:800;font-family:var(--mono);color:var(--muted2);background:var(--surface);border-radius:5px;padding:2px 7px}
.tour-body{flex:1;overflow-y:auto;padding:8px}
.tour-body::-webkit-scrollbar{width:3px}
.tour-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.tour-item{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;padding:8px 10px;border-radius:9px;border:1px solid var(--border);margin-bottom:6px;background:var(--surface)}
.tour-num{width:22px;height:22px;border-radius:7px;background:var(--text);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tour-info{flex:1;min-width:0}
.tour-info-name{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour-info-dist{font-size:10px;color:var(--muted);font-family:var(--mono)}
/* ----------------------------------------------------------------------------
   LA DATE ET L'HEURE DU RENDEZ-VOUS
   ----------------------------------------------------------------------------
   Ni dans .tour-info-name, que text-overflow tronque, ni ajoutée à
   .tour-info-dist qui porte déjà le type d'action et la distance. Et pas
   davantage en troisième enfant de .tour-info : mesuré, « Mercredi 28 septembre
   · 14h30 » demande 174 px quand cette colonne — rognée par les 22 px de
   .tour-num et par le bouton .tour-pick — n'en offre que 142. La ligne s'y
   repliait en deux, portant l'item de 60 à 73 px selon la longueur du mois.
   D'où un quatrième enfant de .tour-item, en flex-basis:100% : le retour à la
   ligne devient celui de l'item (flex-wrap:wrap ci-dessus), et la boîte mesure
   209 px — la largeur pleine moins les 32 px de retrait qui l'alignent sous le
   nom. Le pire libellé y demande 174 px : il tient d'une seule ligne. Le nowrap
   tient cette promesse : un libellé plus long déborderait plutôt que de faire
   grandir la ligne en silence.
   Le gap de .tour-item est passé de 10 px à 3 px 10 px pour cette raison :
   flex-wrap fait aussi du gap un écart ENTRE RANGÉES, et les 10 px hérités
   posaient l'item à 69 px. La colonne, elle, garde ses 10 px d'origine.
   Mesures en panneau de 280 px, polices Geist chargées, trois tirs concordants :
   une fiche prospect reste à 46 px, une fiche à rendez-vous passe de 46 à
   62 px, quelle que soit la longueur du mois. Cette croissance est assumée —
   c'est l'heure du rendez-vous qui commande la journée.
   Couleur posée en ligne, celle du type d'action, comme .tour-info-dist le fait
   déjà pour son libellé.
---------------------------------------------------------------------------- */
.tour-info-rdv{flex-basis:100%;margin-left:32px;font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap}
/* ----------------------------------------------------------------------------
   LA FICHE RETENUE POUR LA TOURNÉE
   ----------------------------------------------------------------------------
   Trois signaux se posent sur la même ligne et ne doivent pas se confondre :
   — le teintage par couleur de type d'action, qui dit « cette fiche porte un
     rendez-vous » et tient border-color et background en style en ligne ;
   — le liseré de scrollToStop, qui dit « c'est celle que vous cherchiez » et
     tient box-shadow, mais 1,5 s seulement ;
   — celui-ci, permanent, qui dit « c'est celle qui termine la tournée ».
   D'où un rail plein en pseudo-élément : il ne touche ni border-color, ni
   background, ni box-shadow, et dessine une barre là où l'autre dessine un
   contour. Il survit au clignotement, qui écrase puis rend le seul box-shadow.
   position:relative sur .retenue seule : la classe de base n'a aucun descendant
   en absolute à ancrer, et rien n'oblige à lui en donner un contexte.
---------------------------------------------------------------------------- */
.tour-item.retenue{position:relative}
.tour-item.retenue::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:9px 0 0 9px;background:var(--text)}
/* Le bouton de désignation, à la place qu'occupe .sched-badge dans une étape de
   tournée. Hors de .tour-info : le nom y est tronqué par text-overflow, un
   bouton l'y rognerait ou s'y ferait rogner, et toute cette surface appelle
   déjà flyTo. Pour cette dernière raison, pas de ::after d'agrandissement
   tactile comme ailleurs dans le fichier : il mordrait sur le clic voisin.
   Sa hauteur — 9,5 px de texte, 5 px de marge, 1 px de bord — tombe sur les
   22 px de .tour-num, donc la ligne ne grandit pas. */
.tour-pick{font-family:inherit;font-size:9.5px;font-weight:700;line-height:1;padding:5px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--card);color:var(--muted);white-space:nowrap;flex-shrink:0;cursor:pointer}
.tour-pick.on{border-color:var(--text);background:var(--text);color:var(--card)}
.tour-footer{padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
/* ----------------------------------------------------------------------------
   « EFFACER » — 44px TOUCHABLES, 29 VISIBLES
   ----------------------------------------------------------------------------
   Ici on ne peut pas agrandir la boîte. .tour-clear vit dans .tour-footer, qui
   est un flex-shrink:0 d'une colonne de hauteur imposée : tout pixel donné au
   pied est un pixel repris à .tour-body, la liste des étapes, qui est le
   flex:1 en face. Quinze pixels de bouton coûteraient quinze pixels de liste.

   Le pseudo-élément du commit 77b44ad : position:relative sur le bouton, un
   ::after en absolute à inset négatif. Il n'a ni fond ni contenu, il ne se
   voit pas ; il hérite du pointer-events du bouton, donc elementFromPoint y
   répond « .tour-clear ». La géométrie, elle, ne connaît pas les absolus :
   .tour-body garde ses 674,2px à 1280 et ses 602,5px à 390, au dixième près,
   avant comme après.

   -9px et pas -7,5 : l'inset se compte depuis la boîte de PADDING, et le
   bouton a une bordure de 1px — les 29px visibles n'en font que 27 pour le
   calcul. 27+18 = 45 : on passe la barre plutôt que de l'effleurer, ce qui
   laisse aussi de quoi absorber le pixel que la fonte fait varier sur la
   hauteur visible. Ces 9px restent à l'intérieur des 10px de padding du pied,
   en haut comme en bas : la zone ne mord ni sur .tour-body ni sous le pied.
   Rien horizontalement, le bouton est déjà en width:100% (247px).
   -------------------------------------------------------------------------- */
.tour-clear{position:relative;width:100%;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .12s}
.tour-clear::after{content:'';position:absolute;inset:-9px 0}
.tour-clear:hover{border-color:var(--red);color:var(--red)}

/* MAP CONTROLS */
.map-toolbar{position:absolute;top:12px;right:12px;z-index:800;display:flex;gap:6px}
.map-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);font-family:var(--font);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:6px;transition:all .12s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.map-btn:hover{border-color:var(--text)}
.map-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

/* ----------------------------------------------------------------------------
   LES COMMANDES DE ZOOM — 44px. Leaflet donne 26px à ses deux boutons, 30 si
   le navigateur se déclare tactile (.leaflet-touch) : sous la cible de 44
   dans les deux cas, et c'est précisément le doigt qui a le moins de marge.

   LE DÉPLACEMENT N'A PAS LIEU. Relevé à 390 : le contrôle occupe (10,66) à
   (44,130), le bouton de tiroir (12,12) à (52,52) — quatorze pixels d'écart,
   aucun croisement. À 1280 le tiroir n'est pas rendu du tout et le contrôle
   est à (74,10), la barre d'outils à 948px de là. Il n'y a rien à éviter :
   agrandir suffit, bouger serait un geste sans cause.

   L'AGRANDISSEMENT NE POUSSE RIEN. Le contrôle vit dans .leaflet-top
   .leaflet-left, un conteneur position:absolute : il est hors flux, sa boîte
   peut grandir sans qu'aucun voisin ne se décale. Après agrandissement il
   descend à 158 au lieu de 130 — toujours sous le tiroir, jamais dessus.

   La spécificité vaut celle de `.leaflet-touch .leaflet-bar a` (deux classes,
   un élément) et cette feuille est chargée après celle de Leaflet : l'ordre
   du cascade tranche. line-height suit la hauteur, sinon les glyphes + et −
   restent collés en haut de leur boîte.
   -------------------------------------------------------------------------- */
.leaflet-control-zoom a.leaflet-control-zoom-in,
.leaflet-control-zoom a.leaflet-control-zoom-out{width:44px;height:44px;line-height:44px}

/* SCHEDULE ITEMS */
.sched-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);margin-bottom:5px;background:var(--surface);transition:opacity .2s}
.sched-time{font-size:11px;font-weight:800;font-family:var(--mono);color:var(--text);min-width:38px;flex-shrink:0;line-height:1.4}
.sched-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.sched-info{flex:1;min-width:0}
.sched-name{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-meta{font-size:10px;color:var(--muted);font-family:var(--mono)}
.sched-tel{font-size:10px;color:var(--muted2);margin-top:1px}
.sched-tel a{color:var(--blue);text-decoration:none}
.sched-tel a:hover{text-decoration:underline}
.sched-badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:9000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ----------------------------------------------------------------------------
   LA BARRE DE SAISIE — 44px, EN VISIBLE
   ----------------------------------------------------------------------------
   Le champ mesurait 32px de haut, le bouton 29 : les deux seules cibles de
   cette barre étaient sous les 44, et ce sont celles qu'on vise au pouce, en
   bas d'écran. Ici on agrandit pour de bon, sans pseudo-élément — parce qu'on
   le peut, et parce qu'un <input> ne rend pas de ::after de toute façon
   (élément remplacé) : la cible du champ ne pouvait venir que de sa boîte.

   RIEN NE SE DÉPLACE. .tour-input-bar est en position:absolute, ancrée par
   bottom:16px : elle est hors flux, aucun voisin ne la suit. Relevé à 1280 et
   à 390, avant puis après : la barre passe de 46 à 58 de haut et son bord BAS
   ne bouge pas d'un pixel — elle grandit vers le haut, sur la carte. Rien
   n'était posé là ; ce qui était sous elle (l'attribution du fond, le pied)
   reste exactement aussi dégagé qu'avant.

   height plutôt qu'un padding vertical : la hauteur devient un nombre, pas une
   somme qui dépendrait de la fonte — c'est ce qui faisait 32 ici et 34 sur une
   machine où Geist se charge autrement. box-sizing:border-box est global, les
   8px de padding et les bordures sont donc compris dans les 44 ; le texte d'un
   input et le libellé d'un button se centrent seuls dans ce qui reste.
   -------------------------------------------------------------------------- */
/* TOUR INPUT BAR */
.tour-input-bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:800;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:6px 8px;box-shadow:0 4px 20px rgba(0,0,0,.12);width:420px;max-width:calc(100% - 260px)}
.tour-input{flex:1;height:44px;border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-family:var(--font);font-size:12px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
.tour-input:focus{border-color:var(--text);background:var(--card)}
.tour-calc-btn{height:44px;padding:8px 16px;border-radius:8px;border:none;background:var(--text);color:#fff;font-family:var(--font);font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .12s}
.tour-calc-btn:hover{background:#000}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ============================================================================
   TÉLÉPHONE — ≤ 640px
   ----------------------------------------------------------------------------
   640 est le seuil applicatif du projet, pas une valeur choisie ici : c'est
   celui de sidebar.css (la barre de gauche y quitte le flux et devient un
   tiroir, --sidebar-w passe à 0, .shell reçoit padding-top:56px) et celui de
   app-footer.css (le pied passe à deux rangées, --app-footer-h à 54px). La
   Carte n'avait aucune media query : elle était la dernière surface à pousser
   du contenu latéralement sous un seuil où le projet a déjà décidé qu'un
   panneau latéral n'a plus le droit d'occuper le flux.

   La zone 641-800px reste hors de ce lot : le panneau y laisse 356 à 456px de
   carte, étroit mais jamais sans issue — le bouton « Actions » y reste
   atteignable.

   LE PIVOT. .shell.tour-open ne veut plus dire « pousse la carte de 280px »,
   elle veut dire « le panneau est ouvert ». La classe survit intacte, posée et
   retirée par le même toggleTourPanel ; seul son effet change. C'est ce qui
   permet à la feuille de style d'interroger l'état du panneau sans qu'aucune
   ligne de JS n'ait à poser un état supplémentaire.

   Conséquence sur invalidateSize (toggleTourPanel, différé de 300ms) : sous ce
   seuil #map ne change plus de taille au basculement, l'appel devient un
   non-événement. Il reste indispensable au-dessus de 640 et n'est pas touché.
   ============================================================================ */
@media (max-width:640px){
  /* Le panneau est déjà en surimpression : position:fixed, translateX(100%),
     z-index:800. Cette seule ligne poussait la carte — plus rien ne pousse. */
  .shell.tour-open{margin-right:0}

  /* --------------------------------------------------------------------
     L'EMPILEMENT. Les trois surfaces carte sont à 800 depuis toujours ;
     tant que la barre d'outils était hors champ sous ce seuil, personne ne
     le voyait. Maintenant qu'elle est revenue dans l'écran, deux dettes
     remontent d'un coup : la barre d'outils se dessine SOUS le panneau
     (elementFromPoint sur « Ma position » rendait .tour-hdr, sur
     « Actions » rendait #tour-count), et les trois surfaces passent
     AU-DESSUS du voile du tiroir de gauche (190), donc cliquables à
     travers lui.

     On abaisse les surfaces carte plutôt que de remonter le tiroir : le
     tiroir et son voile sont partagés par toute l'application et vivent
     dans sidebar.css, la Carte est la seule à déborder. Corriger chez soi.

     Ordre obtenu, du plus haut au plus bas :
       tiroir 200 > voile 190 > bouton de tiroir 150
         > barre d'outils 140 > panneau 120 > barre de saisie 100
     140 laisse dix sous le bouton de tiroir et cinquante sous le voile :
     aucune valeur n'est collée à sa borne, et les vingt qui séparent
     chaque surface de la suivante laissent de quoi intercaler plus tard.
     La barre d'outils passe au-dessus du panneau — c'est ce qui rend
     « Ma position » et « Actions » cliquables panneau ouvert comme fermé.
     Le toast (9000) et le pied (5) ne sont pas concernés : le premier doit
     rester au-dessus de tout, le second n'a jamais été en litige.
     -------------------------------------------------------------------- */
  .map-toolbar{z-index:140}
  .tour-panel{z-index:120}
  .tour-input-bar{z-index:100}

  /* --------------------------------------------------------------------
     LA BARRE D'OUTILS, SOLIDAIRE DE LA FENÊTRE. En absolute, elle était
     accrochée à la boîte de padding du .shell, c'est-à-dire au seul
     conteneur qui bouge sous ce seuil : hier le margin-right du panneau,
     aujourd'hui le padding-top:56px du tiroir, demain autre chose. Elle
     n'a rien à suivre de tout cela — elle se pose sur la fenêtre, comme
     le bouton de tiroir et pour la même raison.

     La position ne bouge pas d'un pixel : sous ce seuil la boîte de
     padding du .shell affleure déjà la fenêtre (marge nulle, bordure
     nulle, et le padding-top ne déplace pas l'origine d'un absolute),
     donc top:12 / right:12 tombaient exactement là où ils tombent
     maintenant. Ce qui change n'est pas où la barre est, c'est à quoi
     elle est accrochée. L'empilement ne bouge pas non plus : .shell est
     position:relative z-index:auto, il ne crée aucun contexte, le 140
     ci-dessus se résolvait déjà à la racine.

     HAUTEUR 40. Le bouton de tiroir fait 40 (sidebar.css), les .map-btn
     faisaient 33 : la rangée haute avait deux hauteurs et se lisait comme
     deux éléments posés côte à côte. box-sizing:border-box est global,
     40px est donc la hauteur finale ; les 8px de padding vertical
     deviennent sans effet et align-items:center recentre le contenu.
     -------------------------------------------------------------------- */
  .map-toolbar{position:fixed;top:12px;right:12px}
  .map-btn{height:40px}

  /* --------------------------------------------------------------------
     LA BARRE DE SAISIE, D'UN BORD À L'AUTRE. Elle était centrée par
     left:50% + translateX(-50%) sur une largeur fixe de 420, ramenée par
     max-width:calc(100% - 260px). Ce 260 est le 280 de .shell.tour-open
     recopié à la main : une réserve pour un panneau qui poussait la
     carte. Sous ce seuil ce panneau ne pousse plus rien depuis que
     .shell.tour-open ne vaut plus margin-right — la réserve n'a plus de
     source, elle ne doit pas lui survivre. À 390 elle amputait la barre
     de 260 des 390 disponibles : 130px pour un champ d'adresse et un
     bouton « Calculer la tournée ».

     left:16 / right:16 remplacent le centrage : la largeur devient celle
     de l'écran moins deux marges, sans nombre à tenir à jour. width:auto
     libère les 420, max-width:none la réserve morte, transform:none le
     décalage qui n'a plus rien à compenser. Le champ est déjà en flex:1
     dans la règle de base : il prend tout ce que le bouton laisse.

     PANNEAU OUVERT, LA BARRE DISPARAÎT. Sous ce seuil le panneau est en
     surimpression pleine hauteur : la barre est dessous, entièrement
     recouverte — le relevé du commit 2 mesurait un elementFromPoint

     peut ni voir ni atteindre n'a pas à rester dans l'arbre. La classe
     pivot fournit l'état, aucune ligne de JS n'a à en poser un.
     -------------------------------------------------------------------- */
  .tour-input-bar{left:16px;right:16px;width:auto;max-width:none;transform:none}
  .shell.tour-open .tour-input-bar{display:none}
}
